<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ollama Chat</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>
<body>
	<main class="page">
		<section class="window" aria-label="Ollama chat">
			<header class="title-bar">
				<div class="title-bar-text">
					<span>Ollama Chat - qwen2.5:1.5b</span>
				</div>
			</header>

			<div class="toolbar">
				<label class="toolbar-group" for="model-select">
					<span class="toolbar-label">Model:</span>
					<select id="model-select" class="win2000-select" disabled title="Model selection is display-only until backend is wired">
						<option selected>qwen2.5:1.5b</option>
						<option>gemma2:2b</option>
					</select>
				</label>
				<span class="toolbar-separator" aria-hidden="true"></span>
				<span class="toolbar-group">
					<span class="status-lamp status-lamp-off" aria-hidden="true"></span>
					<span class="toolbar-label">Backend: not connected</span>
				</span>
				<span class="toolbar-spacer"></span>
				<button class="win2000-btn" id="new-chat-btn" type="button">New Chat</button>
				<button class="win2000-btn" id="clear-btn" type="button">Clear</button>
			</div>

			<div class="chat-scroll" id="chat-scroll">
				<div class="chat-inner" id="chat-log" aria-live="polite" aria-label="Conversation"></div>
			</div>

			<footer class="composer">
				<label class="composer-label" for="composer-input">Message:</label>
				<div class="composer-row">
					<textarea
						id="composer-input"
						class="win2000-inset composer-input"
						rows="3"
						maxlength="2000"
						placeholder="Type a message... (sending is local-only, backend not wired)"
					></textarea>
					<div class="composer-buttons">
						<button class="win2000-btn win2000-btn-default" id="send-btn" type="button">Send</button>
						<span class="composer-hint">Enter: send<br>Shift+Enter: newline</span>
					</div>
				</div>
			</footer>

			<div class="status-bar">
				<span class="status-cell status-cell-wide" id="status-text">Ready</span>
				<span class="status-cell" id="char-count">0 / 2000</span>
			</div>
		</section>
	</main>
</body>
</html>
